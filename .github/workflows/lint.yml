# valence_lint and the registry codegen check on every push to main or feat/**
# and every pull request. An alarm, not a gate: no branch protection reads it.
name: lint

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # The Python, codespell and PyYAML the local lint runs; bump them together.
      - run: python -m pip install codespell==2.4.3 pyyaml==6.0.3
      # --no-gen: the RFC queue check needs the bd database, which CI does not
      # have; the registry half of --gen runs as its own step below.
      - run: python tools/valence_lint.py --no-gen
      - name: Generated registry header and JS vocabulary match registry.yaml
        run: python tools/gen_registry_header.py --check
